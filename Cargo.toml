[package]
name = "decklive"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "API e player web do DeckLive"

[dependencies]
arc-swap = "1.9.3"
axum = "0.8"
brotli = "9.1.1"
bytes = "1.12.1"
flate2 = "1.1.10"
getrandom = "0.4"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "compression-br", "fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
